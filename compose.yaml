services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raftscore
      POSTGRES_USER: raftscore
      POSTGRES_PASSWORD: ${RAFT_SCORE_DATABASE_PASSWORD:?Set RAFT_SCORE_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${RAFT_SCORE_DATABASE_PORT:-5432}:5432"
    volumes:
      - raftscore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raftscore -d raftscore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raftscore-postgres-data:
